default_stages: [pre-commit]
default_language_version:
  node: system

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        # executed notebooks are generated by the pipeline
        exclude: ^notebooks/output/
      - id: end-of-file-fixer
        # executed notebooks are generated by the pipeline
        exclude: ^notebooks/output/
      - id: check-toml

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.10.0
    hooks:
      - id: commitizen

  - repo: https://github.com/executablebooks/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        additional_dependencies:
          - mdformat-gfm
          - mdformat-pyproject
          - mdformat-ruff

  - repo: https://github.com/pappasam/toml-sort
    rev: v0.24.3
    hooks:
      - id: toml-sort-fix
        args: ["--in-place"]

  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.37.1
    hooks:
      - id: yamllint

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.34.1
    hooks:
      - id: check-github-workflows

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.8
    hooks:
      - id: actionlint

  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.1
    hooks:
      - id: pyupgrade

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        # executed notebooks are generated by the pipeline
        exclude: ^notebooks/output/
        additional_dependencies:
          - tomli

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.4
    hooks:
      - id: ruff
        args: ["--fix"]
        # executed notebooks are generated by the pipeline
        exclude: ^notebooks/output/
      - id: ruff-format
        # executed notebooks are generated by the pipeline
        exclude: ^notebooks/output/

  - repo: https://github.com/kynan/nbstripout
    rev: 0.8.1
    hooks:
      # source notebooks are committed without outputs
      - id: nbstripout
        exclude: ^notebooks/output/
      # executed notebooks keep their outputs, but not the widget state (e.g.,
      # of the progress bars), which GitHub cannot render
      - id: nbstripout
        name: nbstripout (executed notebooks)
        files: ^notebooks/output/
        args: ["--keep-output", "--keep-count"]

  - repo: https://github.com/snakemake/snakefmt
    rev: v0.11.2
    hooks:
      - id: snakefmt
